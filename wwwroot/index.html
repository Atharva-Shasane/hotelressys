<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LuxeStay | Hotel Reservation System</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --accent: #ec4899;
            --success: #10b981;
            --danger: #f43f5e;
            --danger-hover: #e11d48;
            --bg: #f8fafc;
            --text: #0f172a;
            --text-muted: #64748b;
            --card-bg: #ffffff;
            --border: #e2e8f0;
        }

        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background-color: var(--bg); 
            color: var(--text); 
            margin: 0; 
            padding-bottom: 60px;
        }

        /* Navbar */
        .navbar { 
            background: rgba(255, 255, 255, 0.85); 
            backdrop-filter: blur(12px);
            padding: 1rem 2rem; 
            border-bottom: 1px solid var(--border);
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            margin-bottom: 2.5rem; 
            position: sticky;
            top: 0;
            z-index: 100;
        }
        
        .navbar h1 { 
            margin: 0; 
            font-size: 1.4rem; 
            font-weight: 700;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .container { max-width: 1100px; margin: 0 auto; padding: 0 20px; }

        /* Form elements */
        label { font-weight: 600; font-size: 0.85rem; color: var(--text-muted); display: block; margin-bottom: 4px; }
        
        input, select { 
            width: 100%; padding: 0.85rem 1rem; margin: 0.4rem 0 1.2rem 0; 
            border: 1px solid var(--border); border-radius: 12px; 
            background: #fff; box-sizing: border-box; transition: all 0.2s ease; 
            font-size: 0.95rem; font-family: inherit;
        }
        input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.15); }
        
        button { 
            background: linear-gradient(135deg, var(--primary), var(--primary-hover)); 
            color: white; border: none; padding: 0.85rem 1.5rem; border-radius: 12px; 
            cursor: pointer; font-weight: 600; font-size: 0.95rem; 
            transition: all 0.25s ease; width: 100%; box-shadow: 0 4px 12px rgba(99, 102, 241, 0.2);
        }
        button:hover { transform: translateY(-2px); box-shadow: 0 6px 16px rgba(99, 102, 241, 0.3); }
        button:active { transform: scale(0.98); }
        button.danger { 
            background: linear-gradient(135deg, var(--danger), var(--danger-hover)); 
            box-shadow: 0 4px 12px rgba(244, 63, 94, 0.2);
        }
        button.danger:hover { box-shadow: 0 6px 16px rgba(244, 63, 94, 0.3); }
        button.small { padding: 0.5rem 1rem; font-size: 0.85rem; width: auto; margin-top: 0;}
        button.auto-width { width: auto; }
        button.secondary {
            background: #f1f5f9; color: var(--text); box-shadow: none; border: 1px solid var(--border);
        }
        button.secondary:hover { background: #e2e8f0; box-shadow: none; }

        /* Grid & Cards */
        .grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); 
            gap: 1.5rem; 
        }
        
        .card { 
            background: var(--card-bg); padding: 1.5rem; border-radius: 16px; 
            border: 1px solid var(--border);
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.02); 
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); 
            display: flex; flex-direction: column; justify-content: space-between;
        }
        .card:hover { transform: translateY(-4px); box-shadow: 0 12px 24px -4px rgba(0,0,0,0.08); border-color: #cbd5e1; }
        
        .badge { 
            display: inline-block; padding: 0.35rem 0.85rem; 
            border-radius: 999px; font-size: 0.75rem; font-weight: 700; 
            letter-spacing: 0.025em; text-transform: uppercase;
        }
        .badge.available { background: #ecfdf5; color: #059669; }
        .badge.booked { background: #fff1f2; color: #e11d48; }

        /* Panels & Sections */
        .panel { 
            background: var(--card-bg); padding: 2rem; border-radius: 20px; 
            margin-bottom: 2rem; border: 1px solid var(--border);
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.02); 
        }
        .admin-panel { border-top: 4px solid var(--primary); }
        .guest-panel { border-top: 4px solid var(--success); }

        /* Modals */
        .modal-overlay { 
            position: fixed; top: 0; left: 0; right: 0; bottom: 0; 
            background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(8px);
            display: flex; justify-content: center; align-items: center; 
            z-index: 1000; opacity: 1; transition: opacity 0.3s;
        }
        .modal { 
            background: var(--card-bg); padding: 2.5rem; border-radius: 24px; 
            width: 90%; max-width: 440px; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25); 
            transform: scale(1); transition: transform 0.3s;
            max-height: 90vh; overflow-y: auto; border: 1px solid var(--border);
        }
        
        .hidden { display: none !important; }

        /* Toast notifications container */
        #toast-container {
            position: fixed; bottom: 20px; right: 20px; z-index: 9999;
            display: flex; flex-direction: column; gap: 10px;
        }
        .toast {
            background: var(--text); color: white; padding: 12px 20px;
            border-radius: 12px; font-size: 0.9rem; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1);
            animation: slideIn 0.3s ease forwards;
        }
        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
    </style>
</head>
<body>

    <div id="toast-container"></div>

    <div class="navbar">
        <h1>✨ LuxeStay System</h1>
        <div>
            <button id="showLoginBtn" class="auto-width secondary" onclick="toggleModal('loginModal', true)">Admin Portal</button>
            <button id="logoutBtn" class="auto-width hidden danger" onclick="logout()">Exit Admin</button>
        </div>
    </div>

    <div class="container">
        <div id="guestCancelArea" class="panel guest-panel">
            <h3 style="margin-top: 0; font-size: 1.25rem;">Manage Your Booking</h3>
            <p style="color: var(--text-muted); margin-bottom: 15px; font-size: 0.95rem;">Have a reservation code? Enter it below to quickly cancel your stay.</p>
            <div style="display: flex; gap: 12px;">
                <input type="number" id="cancelReservationId" placeholder="Enter Reservation ID" style="margin: 0;">
                <button class="danger auto-width" onclick="cancelBooking()">Cancel Booking</button>
            </div>
        </div>

        <div id="adminArea" class="hidden">
            <div class="panel admin-panel">
                <h3 style="margin-top: 0; font-size: 1.25rem;">Add New Room</h3>
                <div style="display: grid; grid-template-columns: 1fr 1fr 1fr auto; gap: 12px; align-items: start;">
                    <div>
                        <label>Room Number</label>
                        <input type="text" id="roomNumber" placeholder="e.g. 101">
                    </div>
                    <div>
                        <label>Room Type</label>
                        <input type="text" id="roomType" placeholder="e.g. Deluxe Suite">
                    </div>
                    <div>
                        <label>Price / Night</label>
                        <input type="number" id="roomPrice" placeholder="e.g. 150">
                    </div>
                    <button class="auto-width" onclick="addRoom()" style="margin-top: 22px;">Add Room</button>
                </div>
            </div>

            <div class="panel admin-panel">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                    <h3 style="margin: 0; font-size: 1.25rem;">Active Reservations</h3>
                    <button class="auto-width small secondary" onclick="loadReservations()">↻ Refresh</button>
                </div>
                <div id="reservationsList" class="grid"></div>
            </div>
        </div>

        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
            <h2 style="margin: 0; font-size: 1.5rem;">Explore Rooms</h2>
        </div>
        <div id="roomsList" class="grid"></div>
    </div>

    <!-- Login Modal -->
    <div id="loginModal" class="modal-overlay hidden">
        <div class="modal">
            <h2 style="margin-top:0; font-size: 1.5rem;">Admin Dashboard Login</h2>
            <label>Username</label>
            <input type="text" id="username" placeholder="admin">
            <label>Password</label>
            <input type="password" id="password" placeholder="admin123">
            <button onclick="login()">Sign In</button>
            <button class="secondary" style="margin-top: 8px;" onclick="toggleModal('loginModal', false)">Cancel</button>
        </div>
    </div>

    <!-- Booking Modal -->
    <div id="bookingModal" class="modal-overlay hidden">
        <div class="modal">
            <h2 style="margin-top:0; font-size: 1.5rem;">Reserve Room <span id="bookingRoomNumber" style="color: var(--primary);"></span></h2>
            <input type="hidden" id="bookRoomId">
            
            <label>Guest Full Name</label>
            <input type="text" id="guestName" placeholder="John Doe">

            <label>Phone Number</label>
            <input type="tel" id="phoneNumber" placeholder="+1 (555) 000-0000">

            <label>Email Address</label>
            <input type="email" id="emailId" placeholder="john@example.com">
            
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                <div>
                    <label>Check-in</label>
                    <input type="date" id="checkIn">
                </div>
                <div>
                    <label>Check-out</label>
                    <input type="date" id="checkOut">
                </div>
            </div>
            
            <button onclick="submitBooking()" style="margin-top: 10px;">Confirm Reservation</button>
            <button class="secondary" style="margin-top: 8px;" onclick="toggleModal('bookingModal', false)">Cancel</button>
        </div>
    </div>

    <script>
        let currentRole = 'Guest';

        function showToast(message) {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.innerText = message;
            container.appendChild(toast);
            setTimeout(() => toast.remove(), 4000);
        }

        function toggleModal(id, show) { document.getElementById(id).classList.toggle('hidden', !show); }
        function toggleVisibility(id, show) { document.getElementById(id).classList.toggle('hidden', !show); }

        async function login() {
            const res = await fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    username: document.getElementById('username').value,
                    password: document.getElementById('password').value
                })
            });

            if (res.ok) {
                currentRole = 'Admin';
                toggleModal('loginModal', false);
                toggleVisibility('showLoginBtn', false);
                toggleVisibility('guestCancelArea', false); 
                toggleVisibility('logoutBtn', true);
                toggleVisibility('adminArea', true);
                loadRooms();
                loadReservations();
                document.getElementById('username').value = '';
                document.getElementById('password').value = '';
                showToast('Welcome back, Admin!');
            } else {
                showToast('⚠️ Invalid login credentials');
            }
        }

        function logout() {
            currentRole = 'Guest';
            toggleVisibility('showLoginBtn', true);
            toggleVisibility('logoutBtn', false);
            toggleVisibility('adminArea', false);
            toggleVisibility('guestCancelArea', true);
            document.getElementById('reservationsList').innerHTML = '';
            loadRooms();
            showToast('Logged out successfully.');
        }

        async function loadRooms() {
            const res = await fetch('/api/rooms');
            const rooms = await res.json();
            const list = document.getElementById('roomsList');
            list.innerHTML = '';

            if(rooms.length === 0) {
                list.innerHTML = '<p style="color:var(--text-muted);">No rooms registered yet.</p>';
                return;
            }

            rooms.forEach(room => {
                const isAvail = room.isAvailable;
                const badgeClass = isAvail ? 'available' : 'booked';
                const badgeText = isAvail ? 'Available' : 'Booked';

                let html = `
                <div class="card">
                    <div>
                        <div style="display: flex; justify-content: space-between; align-items: start; margin-bottom: 8px;">
                            <h3 style="margin: 0; font-size: 1.25rem;">Room ${room.roomNumber}</h3>
                            <span class="badge ${badgeClass}">${badgeText}</span>
                        </div>
                        <p style="color: var(--text-muted); margin: 0 0 15px 0; font-size: 0.9rem; font-weight: 500;">${room.type}</p>
                        <p style="font-size: 1.35rem; font-weight: 700; margin: 0 0 20px 0; color: var(--primary);">$${room.pricePerNight}<span style="font-size:0.8rem; color:var(--text-muted); font-weight: normal;"> / night</span></p>
                    </div>
                    <div>`;
                
                if (isAvail) {
                    html += `<button onclick="openBookingForm(${room.id}, '${room.roomNumber}')">Book Now</button>`;
                } else {
                    html += `<button disabled style="background: #f1f5f9; color: #94a3b8; cursor: not-allowed; box-shadow: none;">Occupied</button>`;
                }

                if (currentRole === 'Admin') {
                    html += `<button class="danger" style="margin-top: 10px;" onclick="deleteRoom(${room.id})">Delete Room</button>`;
                }
                html += `</div></div>`;
                list.innerHTML += html;
            });
        }

        function openBookingForm(id, roomNumber) {
            document.getElementById('bookRoomId').value = id;
            document.getElementById('bookingRoomNumber').innerText = '#' + roomNumber;
            document.getElementById('guestName').value = '';
            document.getElementById('phoneNumber').value = '';
            document.getElementById('emailId').value = '';
            document.getElementById('checkIn').value = '';
            document.getElementById('checkOut').value = '';
            toggleModal('bookingModal', true);
        }

        async function submitBooking() {
            const reservation = {
                roomId: parseInt(document.getElementById('bookRoomId').value),
                guestName: document.getElementById('guestName').value,
                phoneNumber: document.getElementById('phoneNumber').value,
                emailId: document.getElementById('emailId').value,
                checkInDate: document.getElementById('checkIn').value,
                checkOutDate: document.getElementById('checkOut').value
            };

            const res = await fetch('/api/reservations', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(reservation)
            });

            if (res.ok) {
                const data = await res.json();
                showToast(`🎉 Room booked successfully! ID: ${data.id}`);
                toggleModal('bookingModal', false);
                loadRooms();
                if (currentRole === 'Admin') loadReservations();
            } else {
                const errorText = await res.text();
                showToast(`⚠️ Error: ${errorText}`);
            }
        }

        async function cancelBooking(adminProvidedId = null) {
            const resId = adminProvidedId || document.getElementById('cancelReservationId').value;
            if (!resId) return showToast('Please enter a Reservation ID.');
            if(!confirm('Are you sure you want to cancel this booking?')) return;

            const res = await fetch(`/api/reservations/${resId}`, { method: 'DELETE' });

            if (res.ok) {
                showToast('Booking cancelled successfully.');
                if (!adminProvidedId) document.getElementById('cancelReservationId').value = '';
                loadRooms();
                if (currentRole === 'Admin') loadReservations();
            } else {
                showToast('⚠️ Reservation not found or already cancelled.');
            }
        }

        async function addRoom() {
            const room = {
                roomNumber: document.getElementById('roomNumber').value,
                type: document.getElementById('roomType').value,
                pricePerNight: parseFloat(document.getElementById('roomPrice').value),
                isAvailable: true
            };

            const res = await fetch('/api/rooms', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'X-Role': currentRole },
                body: JSON.stringify(room)
            });

            if (res.ok) {
                loadRooms();
                document.getElementById('roomNumber').value = '';
                document.getElementById('roomType').value = '';
                document.getElementById('roomPrice').value = '';
                showToast('Room added successfully!');
            } else {
                const errorText = await res.text();
                showToast(`⚠️ Error: ${errorText}`);
            }
        }

        async function deleteRoom(id) {
            if(!confirm('Permanently delete this room?')) return;
            const res = await fetch(`/api/rooms/${id}`, {
                method: 'DELETE',
                headers: { 'X-Role': currentRole }
            });
            if (res.ok) {
                loadRooms();
                showToast('Room deleted.');
            } else {
                const errorText = await res.text();
                showToast(`⚠️ Error: ${errorText}`);
            }
        }

        async function loadReservations() {
            if (currentRole !== 'Admin') return;
            const res = await fetch('/api/reservations', { headers: { 'X-Role': currentRole } });
            const reservations = await res.json();
            const list = document.getElementById('reservationsList');
            list.innerHTML = '';
            
            if(reservations.length === 0) {
                list.innerHTML = '<p style="color:var(--text-muted); margin: 0;">No active reservations found.</p>';
                return;
            }

            reservations.forEach(r => {
                const checkIn = new Date(r.checkInDate).toLocaleDateString();
                const checkOut = new Date(r.checkOutDate).toLocaleDateString();
                list.innerHTML += `
                <div class="card" style="border-left: 4px solid var(--primary);">
                    <div style="margin-bottom: 15px;">
                        <span style="font-size: 0.75rem; color: var(--primary); font-weight: 700; text-transform: uppercase;">Reservation #${r.id}</span>
                        <h4 style="margin: 4px 0; font-size: 1.1rem;">${r.guestName}</h4>
                        <p style="margin: 0 0 8px 0; font-size: 0.85rem; color: var(--text-muted);">📞 ${r.phoneNumber}<br>✉️ ${r.emailId}</p>
                        <p style="margin: 0 0 6px 0; color: var(--text); font-weight: 600; font-size: 0.95rem;">Room #${r.roomNumber}</p>
                        <p style="margin: 0; font-size: 0.85rem; color: var(--text-muted);">📅 ${checkIn} &rarr; ${checkOut}</p>
                    </div>
                    <button class="danger small" onclick="cancelBooking(${r.id})">Cancel Booking</button>
                </div>`;
            });
        }

        loadRooms();
    </script>
</body>
</html>
